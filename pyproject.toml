[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "data-goblin"
version = "0.1.0"
description = "Constitutionally constrained synthetic-data research orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
neural = ["torch", "transformers"]
hrm-text = ["torch>=2.5", "transformers>=5.3"]
rlt-pilot = ["autograd==1.8.0", "psutil>=5.9"]
interpretability = ["nnsight==0.8.3"]
provider = []
dev = ["jsonschema>=4", "mypy>=1.10", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
datagoblin = "datagoblin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/datagoblin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["datagoblin"]

[tool.ruff.lint.per-file-ignores]
# Exact archived MathCan generator; preserve source bytes for provenance replay.
"training/rlt_gym/bsar09/mathcan_exact_oracle.py" = ["RUF005"]
