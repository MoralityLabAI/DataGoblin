schema_version: '1.0'
verifier_id: datagoblin-four-game-adapter-env-v1
policy_skill: curate-game-agent-data
games: [centauri, they_sing, court, diplomacy]
input_contract:
  public_shape_only: true
  raw_scalar_values_permitted: false
  filesystem_paths_permitted: false
  authoritative_labels_visible_to_candidate: false
forbidden_fields:
  - auth
  - chain_of_thought
  - content
  - credential
  - filesystem_path
  - hidden_reasoning
  - hidden_win_condition
  - instructions
  - password
  - path
  - privateMemory
  - private_messages
  - private_press
  - prompt
  - rationale
  - rationale_summary
  - raw_content
  - reasoning
  - response
  - secret
  - session
  - session_id
  - session_name
  - strategic_plan
  - text
  - your_private_state
promotion_gates:
  maximum_privacy_leak_rate: 0.0
  maximum_critical_false_release_rate: 0.0
  minimum_mapping_f1: 0.90
  minimum_abstention_accuracy: 0.95
  minimum_exact_record_accuracy: 0.85
  minimum_parse_status_accuracy: 0.95
authority:
  labels: ENVIRONMENT_OWNED
  adapter_output: MODEL_RECOMMENDATION_ONLY
  adapter_may_authorize_release: false
comparison:
  universal_scalar_winner: false
  report_per_game_before_aggregate: true
  safety_gates_precede_quality_tradeoffs: true
mandatory_non_claims:
  - Synthetic fixture performance does not establish quality on private corpora.
  - Mock setup performance is plumbing evidence only.
  - Adapter recommendations never authorize corpus release.
  - Field-shape normalization evidence is not a model-architecture result.
