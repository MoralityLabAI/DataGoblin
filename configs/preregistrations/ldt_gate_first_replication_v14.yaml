schema_version: '14.0'
experiment_id: datagoblin-ldt-gate-first-replication-v14
status: frozen_before_dataset_generation
training_task_id: ldt-gate-first-replication-v14-seed-sweep

purpose: >
  Replicate the exact selected-count global model on fresh lineages and test
  whether gate-first seed selection yields a development-qualified primary
  before one primary-only independent confirmation join.
claim_scope: >
  Environment-owned synthetic tournament-summary evidence only. Results do not
  authorize corpus promotion, deployment, a universal adapter champion, or
  training a larger checkpoint.
skill_fingerprint:
  schema_version: skill-fingerprint.v1
  skill_name: curate-game-agent-data
  skill_sha256: b74de9417f153a47d34d9e94413510f186af1d7ce52e30c9fd8fc813f1dc4e7f

source_evidence:
  experiment_id: datagoblin-ldt-status-composition-v13
  preregistration_sha256: 4c9e709c6c4168b53c29c279769984916cb03b0203c9f77b314dab0d664a6f20
  development_selection_sha256: 7e88eb13f32cfb85008385945f80930b918a60372fb3f596882afd2956602e50
  public_evidence_audit_sha256: a31c25413cada5f50e5a16adc4c7ee62166bd4fb20a62decbcd5ce0e95275997
  confirmation_spent: false
  conclusion: >
    All-status composition underperformed the smaller selected-count control.
    One nonretained selected-count seed crossed every numeric gate, but the
    frozen rank-then-qualify rule retained another seed. Replicate the smaller
    architecture on fresh lineages with qualification before ranking; do not
    reuse or post-hoc retain the v13 seed.

selection_policy_repair:
  evidence_status: prospective_after_v13_development_audit
  v13_records_immutable: true
  prior_selection_semantics: rank_then_qualify_per_architecture
  new_selection_semantics: gate_then_rank_per_architecture
  diagnostic_fallback_never_authorizes_confirmation: true
  primary_only_confirmation_packet: true

