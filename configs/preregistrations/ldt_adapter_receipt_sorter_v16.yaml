schema_version: '16.0'
experiment_id: datagoblin-ldt-adapter-receipt-sorter-v16
status: frozen_before_dataset_generation
training_task_id: ldt-adapter-receipt-sorter-v16-seed-sweep

purpose: >
  Test whether representative safe adapter-receipt arrays and a target-free
  directed cross-bound edge encoder repair v15's failure to distinguish
  SELECTED, DOMINATED, and UNRESOLVED trainable candidates on the downstream
  four-game architecture-tournament domain.
claim_scope: >
  Environment-owned synthetic adapter-receipt evidence only. A passing result
  may authorize one newly frozen downstream shadow use. It does not authorize
  corpus promotion, deployment, a universal adapter champion, or real
  LoRA/HRM checkpoint training.
