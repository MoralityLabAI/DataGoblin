schema_version: '7.0'
experiment_id: datagoblin-ldt-target-independent-v7
status: frozen_before_dataset_generation
training_task_id: ldt-target-independent-v7-seed-sweep

purpose: >
  Test whether small linear, latent, and weight-tied looped array models can learn
  the independent interval-sorting task without policy-derived lattice features,
  category-template proxies, or confirmation-label access.
claim_scope: >
  Environment-owned synthetic tournament-summary evidence only. Results are evidence
  about this bounded feature surface, not authority to promote corpus records, deploy
  a sorter, train a larger checkpoint, or claim a universal adapter champion.

source_diagnostic:
  experiment_id: datagoblin-ldt-independent-shift-v6
  conclusion: >
    The v3 typed latent result was causally dependent on policy-derived lattice
    features. Full-lattice accuracy was 1.0 while the same checkpoint reached
    0.6129 accuracy and zero exact arrays when those features were masked.

independent_builder:
  implementation_id: datagoblin.shift_builder.v6
  role: FIXTURE_BUILDER
  target_logic_available: false
  target_files_emitted: false

independent_verifier:
  implementation_id: datagoblin.shift_verifier.v6
  role: ENVIRONMENT_OWNED_VERIFIER
  labels_sealed_before_training: true
  labels_emitted_only_to_private_custody: true

surface:
  games: [centauri, they_sing, court, diplomacy]
  pressures:
    - near_tolerance_dominance
    - near_tolerance_equivalence
    - controlled_missingness
    - boundary_pareto_tradeoff
  train_array_sizes: [4, 5, 6, 4, 5, 6]
  heldout_array_sizes: [6, 4, 5]
  train_seed: 3407
  heldout_seed: 3613
  train_context_prefix: target_independent_v7_development
  heldout_context_prefix: target_independent_v7_confirmation
  orientation_contract: both_directions_for_every_unordered_pair
  metric_equivalence_tolerance: 0.01
