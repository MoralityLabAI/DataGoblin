dataset_contract:
  schema_version: curation-taste-array-confirmation.v3
  required_train_pairs: 496
  required_heldout_pairs: 248
  required_train_arrays: 24
  required_heldout_arrays: 12
  required_train_reports: 120
  required_heldout_reports: 60
  required_train_lineage_groups: 4
  required_heldout_lineage_groups: 4
  require_array_sizes: [4, 5, 6]
  require_all_pair_preferences: true
  require_all_rationale_codes: true
  require_all_array_statuses: true
  require_disjoint_context_categories: true
  require_report_hash_bindings: true
  heldout_pair_targets_available_to_candidate: false
  heldout_array_targets_available_to_candidate: false
  forbidden_candidate_feature_fragments:
    - lattice
    - dominance
    - equivalent
    - tradeoff
    - insufficient
    - context_mode
    - fixture_pressure
    - optimization_pressure
    - delta
    - mismatch

models:
  controls: []
  candidates:
    - model_id: linear-independent-v7
      family: joint_linear_array
      feature_view: independent
      hidden_width: 0
      loop_count: 0
      epochs: 400
      learning_rate: 0.06
    - model_id: latent-independent-h4-v7
      family: latent_array
      feature_view: independent
      hidden_width: 4
      loop_count: 1
      epochs: 600
      learning_rate: 0.025
    - model_id: looped-independent-h4-l2-v7
      family: weight_tied_looped_array
      feature_view: independent
      hidden_width: 4
      loop_count: 2
      epochs: 600
      learning_rate: 0.025
    - model_id: looped-independent-h8-l3-v7
      family: weight_tied_looped_array
      feature_view: independent
      hidden_width: 8
      loop_count: 3
      epochs: 600
      learning_rate: 0.02

training:
  seeds: [19, 43, 83]
  validation: leave_one_training_pressure_lineage_out
  batch_size: 24
  checkpoint_interval: {epochs: 100, seconds: 60}
  chunk_strategy: at_most_24_pair_arrays_per_gradient_chunk
  class_balancing: inverse_frequency
  rationale_loss_weight: 0.5
  l2: 0.0005
  gradient_norm_clip: 5.0
  external_checkpoint: null
  network_permitted: false

confidence_calibration:
  fit_split: out_of_fold_development_predictions_only
  method: frozen_temperature_grid
  temperatures: [0.5, 0.75, 1.0, 1.5, 2.0, 3.0]
  selection_metric: multiclass_negative_log_likelihood
  expected_calibration_error_bins: 10
  maximum_qualified_ece: 0.20

development_selection:
  timing: after_training_before_confirmation_join
  source: development_cv_and_oof_calibration_only
  select_one_seed_per_architecture: true
  primary_selection_permitted: true
  required_mean_safety_gate_accuracy: 1.0
  required_mean_swap_consistency: 1.0
  minimum_mean_abstain_recall: 0.75
  maximum_oof_expected_calibration_error: 0.20
  ranking:
    - maximize_worst_fold_preference_macro_f1
    - maximize_mean_preference_macro_f1
    - maximize_worst_fold_abstain_recall
    - minimize_oof_negative_log_likelihood
    - minimize_trainable_parameters
    - minimize_seed
  no_qualified_primary_result: null

hard_caps:
  wrapper: scripts/run_training_gym_capped_wsl.sh
  ram_mb: 2048
  cpu_percent: 50
  io_mb_per_second: 50
  wall_clock_seconds: 900
  swap_bytes: 0
  fallback_if_unavailable: abort_without_training

heldout_evaluation:
  reveal_count: 1
  no_post_reveal_tuning: true
  retained_candidate_id: null
  require_all_array_sizes: [4, 5, 6]
  minimum_selected_set_exact_accuracy: 0.75
  report_by_game: true
  report_by_pressure: true
  report_support_counts: true
  universal_scalar_champion_permitted: false
  comparison_rule: >
    Report every development-selected architecture and the frozen development primary.
    Confirmation labels may not alter seeds, architectures, temperatures, thresholds,
    features, or the primary selection.

promotion_boundary:
  sorter_authority: MODEL_RECOMMENDATION_ONLY
  checkpoint_promotion_authorized: false
  corpus_promotion_authorized: false
  deployment_authorized: false
  larger_model_training_authorized: false
  next_gate: >
    Use the single sealed confirmation to decide whether any independent-feature
    architecture merits a new shadow-only trial beside the environment verifier.
