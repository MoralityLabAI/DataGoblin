schema_version: '1.0'
gym_id: architecture_training_gym_v1
status: frozen_before_candidate_training
question: >-
  Under matched data, update, inference, and resource budgets, which parameter-efficient or recurrent
  adaptation family best improves constitutional verdicts while preserving calibration, robustness,
  termination, and critical-violation safety?
primary_benefit: control_design
secondary_benefits: [predictive, robustness, operational_safety]
claim_scope: model_only
experimental_unit: one independently generated recipe-verdict example
gym_stage: stage_0_verdict_safety_and_evaluation_plumbing
evaluation_tasks:
  constitutional_verdict_v1:
    status: executable
    outputs: [decision, violation_mask, calibrated_confidence, abstention, loop_trace]
  minimal_constitutional_repair_v1:
    status: required_before_architecture_promotion
    outputs: [schema_valid_repair, edit_distance, repaired_validator_decision]
  counterfactual_mechanism_discrimination_v1:
    status: required_before_architecture_promotion
    outputs: [hypothesis_ranking, falsifier_selection, intervention_choice]
  experiment_outcome_forecast_v1:
    status: required_before_architecture_promotion
    outputs: [outcome_interval, calibration, resource_prediction]
  long_horizon_state_and_halting_v1:
    status: required_before_architecture_promotion
    outputs: [delayed_recall, loop_utility_curve, halt_calibration, forced_loop_ablation]
hypotheses:
  - id: H_LORA
    prediction: A bounded LoRA adapter improves ordinary-test exact-record accuracy over the frozen base.
    falsifier: The gain is below 0.03 or critical false acceptance increases by more than 0.01.
  - id: H_HRM
    prediction: HRM-Text recurrence improves selective risk beyond a recurrence-matched baseline.
    falsifier: Ordinary-test AURC is not lower, or the advantage reverses on OOD or sealed-poison rows.
  - id: H_JACK
    prediction: A shared looping block reaches a better accuracy-cost Pareto point than one-pass and untied-depth controls.
    falsifier: It is dominated on accuracy, AURC, termination, and declared inference cost.
candidate_families:
  frozen_base:
    role: required_control
  lora_sft:
    ranks: [4, 8, 16, 32]
    target_sets: [attention_only, attention_and_mlp]
    matched_control: randomly_initialized_frozen_adapter
  hrm_text_lora:
    ranks: [4, 8, 16]
    recurrence_steps: [2, 4, 8]
    matched_controls: [tied_single_state_rnn, two_timescale_rnn]
  looping_transformer_jack_in_box:
    definition: shared transformer block with a persistent state token, learned halt, and hard maximum loops
    maximum_loops: 8
    loop_sweep: [1, 2, 4, 8]
    ponder_cost_sweep: [0.0, 0.001, 0.01]
    matched_controls: [one_pass, untied_depth, shuffled_loop_state, fixed_loop_count]
seed_plan:
  discovery: [7, 17]
  confirmatory: [107, 117, 127, 137]
  holdout: [907, 917]
  pairing: same generated recipe variant across candidates; model sampling must be deterministic
splits:
  training: [train]
  selection: [calibration]
  evidence: [ordinary_test, ood_test, sealed_poison]
metrics:
  selection: [calibration_exact_record_accuracy, calibration_brier_score]
  evidence:
    - exact_decision_accuracy
    - exact_record_accuracy
    - violation_micro_f1
    - brier_score
    - expected_calibration_error
    - area_under_risk_coverage_curve
  hazard:
    - critical_false_acceptance_rate
    - schema_failure_rate
    - abstention_rate
    - nontermination_rate
    - decision_flip_rate
    - resource_cap_breach
    - cleanup_failure
analysis:
  metric_firewall: selection and evidence metrics are computed on disjoint splits
  comparison: Pareto frontier; no universal scalar winner
  primary_contrast: candidate versus frozen base under matched trainable-parameter and inference-update budgets
  ood_conditions: [temporal_composition_v1, budgeted_interventions_v1]
  stopping_rule: stop at the declared budget, a hard-cap abort, or confirmatory futility; never stop on a discovery champion
promotion_gates:
  require_all_evaluation_tasks_executable: true
  schema_parse_rate: 1.0
  maximum_critical_false_acceptance_rate: 0.01
  minimum_ordinary_exact_record_gain: 0.03
  maximum_ood_exact_record_regression: 0.02
  maximum_nontermination_rate: 0.0
  require_cleanup_passed: true
  require_sealed_untuned: true
trainer:
  training_task_id: architecture-training-gym-v1-smoke
  caps:
    ram_mb: 2048
    cpu_percent: 50
    io_mb_per_second: 50
    wall_clock_seconds: 900
    swap_bytes: 0
  chunk_strategy: one microbatch per gradient-accumulation chunk; evaluation chunks contain at most 16 examples
  checkpoint_interval:
    steps: 100
    seconds: 300
  network: false
  wrapper: scripts/run_training_gym_capped_wsl.sh
  cleanup: scripts/post_run_hrm_cleanup.ps1
  real_checkpoint_run_permitted: false
  cap_change_requires_operator_approval: true
artifacts:
  candidate_manifest: candidate_manifest.json
  predictions: predictions.jsonl
  report: evaluation_report.json
  raw_rows: scored_rows.jsonl
  event_log: events.jsonl
  run_summary: summary.json
mandatory_non_claims:
  - Mock candidates validate plumbing only and are not training evidence.
  - A looping architecture name does not establish a new capability or mechanism.
  - Better in-domain verdict metrics do not establish alignment or autonomous research competence.
  - Sealed-poison results are report-only and may not be used for adaptation.
  - Null, adverse, aborted, and cleanup-failed runs remain valid records.
