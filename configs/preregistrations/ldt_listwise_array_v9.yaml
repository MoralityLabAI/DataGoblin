schema_version: '9.0'
experiment_id: datagoblin-ldt-listwise-array-v9
status: frozen_before_dataset_generation
training_task_id: ldt-listwise-array-v9-seed-sweep

purpose: >
  Test whether direct, permutation-equivariant listwise status training can
  recover complete selected sets after v8 solved support, safety, orientation,
  and calibration but failed the array-selection gate.
claim_scope: >
  Environment-owned synthetic tournament-summary evidence only. Results do not
  authorize corpus promotion, deployment, a universal adapter champion, or
  training a larger checkpoint.
skill_fingerprint:
  schema_version: skill-fingerprint.v1
  skill_name: curate-game-agent-data
  skill_sha256: 4a601e0dfa9989fef1492674fd0fb5355d6be6d39152f0de21c8c00318fe266a

source_evidence:
  experiment_id: datagoblin-ldt-structured-array-v8
  preregistration_sha256: 6e2eed040c4b1f8d9f87823e09ca6c2c51f165bf6b8c2656a3616ccc353e547b
  development_selection_sha256: c8c5617bfb5b49d33bd74598af5fc3c2cc0514994ed4798df4272e164dc756e5
  confirmation_spent: false
  conclusion: >
    Exact antisymmetry reached 1.0 swap consistency and structured weighting
    raised status macro-F1 to 0.8711, but selected-set exactness peaked at
    0.6250 across all runs. ECE was not the bottleneck. Replace the indirect
    pair weighting with one direct listwise status objective.

