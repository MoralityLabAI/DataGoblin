schema_version: '5.0'
experiment_id: datagoblin-ldt-shadow-succession-v5
status: frozen_before_shadow_generation

purpose: >
  Test whether the confirmed one-pass typed latent sorter remains calibrated and
  exact across three append-only, non-authoritative shadow rounds on fresh,
  content-free tournament summaries.
claim_scope: >
  Synthetic shadow-monitoring evidence only. Every round is independently
  verified. No recommendation can change a verifier decision, promote corpus
  records, trigger training, or authorize a larger checkpoint.

