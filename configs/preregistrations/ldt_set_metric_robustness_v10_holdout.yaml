    source_ref: custody://datagoblin-v10-metric-holdout/seeded-high-cardinality-decoy
  - probe_id: v10-holdout-anti-gaming-inventory-01
    probe_family_id: seeded-inventory-substitution
    probe_type: anti_gaming
    split: held_out
    metric_ids: [exact_status_vector_accuracy, exact_selected_set_accuracy]
    expected_behavior: detect_violation
    source_ref: custody://datagoblin-v10-metric-holdout/seeded-inventory-substitution
  - probe_id: v10-holdout-clean-shuffle-01
    probe_family_id: seeded-exact-shuffle-control
    probe_type: clean_control
    split: held_out
