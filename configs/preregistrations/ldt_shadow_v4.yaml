purpose: >
  Integrate the confirmed one-pass typed latent sorter as a non-authoritative shadow
  recommendation beside the independent curation verifier on fresh, content-free
  tournament summaries.
claim_scope: >
  Synthetic shadow-monitoring evidence only. The model cannot change verifier decisions,
  promote corpus records, trigger training, or authorize a larger checkpoint.

