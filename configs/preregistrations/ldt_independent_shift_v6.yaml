schema_version: '6.0'
experiment_id: datagoblin-ldt-independent-shift-v6
status: frozen_before_shift_generation

purpose: >
  Measure how frozen LDT and linear sorters behave under independently generated,
  boundary-dense feature shifts and controlled missingness, while causally isolating
  reliance on policy-derived typed lattice features.
claim_scope: >
  Synthetic sealed-evaluation evidence only. The full-lattice setup is a circularity
  diagnostic, not an eligible model. No setup may select an adapter, alter verifier
  decisions, enter training, promote corpus records, or authorize deployment.

