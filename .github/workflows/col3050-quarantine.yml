name: COL-DG-02 native gym root quarantine
on:
  pull_request:
    paths: ['src/datagoblin/training_gym/collatz_3050_guard.py', 'tests/test_collatz_3050_guard.py', 'tests/fixtures/col3050_development.json', '.github/workflows/col3050-quarantine.yml']
  push:
    paths: ['src/datagoblin/training_gym/collatz_3050_guard.py', 'tests/test_collatz_3050_guard.py', 'tests/fixtures/col3050_development.json', '.github/workflows/col3050-quarantine.yml']
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_collatz_3050_guard.py -v
      - run: PYTHONPATH=src python -m datagoblin.training_gym.collatz_3050_guard tests/fixtures/col3050_development.json
