name: DG Research20M gym pilot
on:
  push:
    branches:
      - research/verifiers-v2.2-adaptive-research-20261128
    paths:
      - ".github/workflows/research20m-gym.yml"
      - "src/datagoblin/research_v2_2/research20m.py"
      - "tests/unit/test_research_v2_2_research20m.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: 7fa19c90372b13d71676e6fef13819d2a18b9be3
          path: _distill
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e . "numpy==2.2.6" pytest "tokenizers==0.22.2" ruff
      - run: python -m pytest tests/unit/test_research_v2_2_research20m.py
      - name: Fetch frozen tokenizer
        run: |
          curl --fail --location --retry 2 --max-time 45 -o "$RUNNER_TEMP/tokenizer.json" https://huggingface.co/HuggingFaceTB/SmolLM2-135M/resolve/93efa2f097d58c2a74874c7e644dbc9b0cee75a2/tokenizer.json
          echo "9ca9acddb6525a194ec8ac7a87f24fbba7232a9a15ffa1af0c1224fcd888e47c  $RUNNER_TEMP/tokenizer.json" | sha256sum -c -
      - name: Native gym pilot
        run: python -m datagoblin.research_v2_2.research20m --distill-checkout _distill --tokenizer "$RUNNER_TEMP/tokenizer.json" --v1-manifest training/data/research_pretrain_v1/manifest.json --out "$RUNNER_TEMP/gym20m" --pilot
      - uses: actions/upload-artifact@v4
        with:
          name: dg20m-pilot-train
          path: ${{ runner.temp }}/gym20m/train/
      - uses: actions/upload-artifact@v4
        with:
          name: dg20m-pilot-development-DO-NOT-TRAIN
          path: ${{ runner.temp }}/gym20m/development/
