name: Aleph direct-A Colab CPU fixture
on:
  pull_request:
    paths:
      - 'training/aleph_next/candidate01/colab10m.py'
      - '.github/workflows/aleph-colab-fixture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy tokenizers==0.22.2
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python training/aleph_next/candidate01/colab10m.py --self-test --device cpu
