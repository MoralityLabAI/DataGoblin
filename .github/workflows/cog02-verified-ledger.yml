name: COG-02 checked lemma ledger

on:
  pull_request:
    paths:
      - src/datagoblin/training_gym/rlt_gym/cogentic_ledger.py
      - tests/unit/test_cogentic_ledger.py
      - training/cogentic/**
      - .github/workflows/cog02-verified-ledger.yml
  push:
    branches: [research/cog02-verified-ledger-20261126]
    paths:
      - src/datagoblin/training_gym/rlt_gym/cogentic_ledger.py
      - tests/unit/test_cogentic_ledger.py
      - .github/workflows/cog02-verified-ledger.yml
  workflow_dispatch:
    inputs:
      native_lean:
        description: Replay all completed proofs in Lean 4.35.0
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/unit/test_cogentic_ledger.py
      - run: ruff check src/datagoblin/training_gym/rlt_gym/cogentic_ledger.py tests/unit/test_cogentic_ledger.py
      - name: Prepare pinned Lean compiler
        if: github.event_name == 'workflow_dispatch' && inputs.native_lean
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "COG_LEAN=$RUNNER_TEMP/lean-4.35.0-linux/bin/lean" >> "$GITHUB_ENV"
      - name: Build and replay the public development corpus
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${COG_LEAN:-}" ]]; then args+=(--lean "$COG_LEAN"); fi
          python -m datagoblin.training_gym.rlt_gym.cogentic_ledger \
            --out "$RUNNER_TEMP/cog02-run" --per-split 64 --seed 20261126 "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cog02-checked-corpus
          path: ${{ runner.temp }}/cog02-run/
          if-no-files-found: error
          retention-days: 21
