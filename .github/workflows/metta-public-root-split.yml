name: MeTTa-04 public root split and leakage audit

on:
  pull_request:
    paths:
      - '.github/workflows/metta-public-root-split.yml'
      - 'MeTTa/training_data/scripts/public_root_splits.py'
      - 'MeTTa/training_data/tests/test_public_root_splits.py'
      - 'MeTTa/training_data/training_candidates/**'
      - 'MeTTa/training_data/annotations/**'
      - 'MeTTa/training_data/raw/**'
      - 'MeTTa/training_data/PUBLIC_SPLIT_PROTOCOL.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/metta-public-root-split.yml'
      - 'MeTTa/training_data/scripts/public_root_splits.py'
      - 'MeTTa/training_data/tests/test_public_root_splits.py'
      - 'MeTTa/training_data/training_candidates/**'
      - 'MeTTa/training_data/annotations/**'
      - 'MeTTa/training_data/raw/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-root-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check audit implementation and regression tests
        run: |
          python -m pip install 'ruff==0.17.6'
          ruff check MeTTa/training_data/scripts/public_root_splits.py MeTTa/training_data/tests/test_public_root_splits.py
          python -m unittest discover -s MeTTa/training_data/tests -p 'test_public_root_splits.py' -v
      - name: Build and validate public development partition artifact
        run: |
          set -euo pipefail
          python MeTTa/training_data/scripts/public_root_splits.py \
            --out runs/metta/public_root_split/plan.json \
            > runs/metta/public_root_split.stdout.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("runs/metta/public_root_split/plan.json").read_text())
          assert plan["training_ready"] is False
          assert plan["sealed_eval_eligible"] is False
          assert plan["independent_semantic_oracle"] is False
          assert plan["candidate_source_labels_already_public"] is True
          assert plan["scope"] == "public_development_diagnostic_only"
          assert sum(plan["packets_by_partition"].values()) == plan["native_query_packets"]
          assert all(x > 0 for x in plan["packets_by_partition"].values())
          assert set(plan["packets_by_partition"]) == {"train_candidate", "dev_public", "test_public"}
          assert sum(plan["roots_by_partition"].values()) == len(plan["root_assignments"])
          print("MeTTa public diagnostic gate passed")
          PY
      - name: Preserve root-only partition and digest audit
        uses: actions/upload-artifact@v4
        with:
          name: metta04-public-root-diagnostic
          path: |
            runs/metta/public_root_split/plan.json
            runs/metta/public_root_split.stdout.json
          retention-days: 14
          if-no-files-found: error
