name: ZKL-14B connected nonlinear search
on:
  pull_request:
    paths:
      - 'src/datagoblin/zk_connected_search_gym.py'
      - 'tests/test_zk_connected_search_gym.py'
      - '.github/workflows/zkl14b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/SatsHedgeZero
          ref: 84c1681a99ef5897f0f6b90140a0ac9e3293f5cb
          path: shz-pinned
      - name: Verify pins and run paired campaign
        env:
          PYTHONPATH: ${{ github.workspace }}/shz-pinned/research/zk_lean
          ZKL13_CHECKER_ROOT: ${{ github.workspace }}/shz-pinned/research/zk_lean
        run: |
          test "$(git -C shz-pinned rev-parse HEAD)" = 84c1681a99ef5897f0f6b90140a0ac9e3293f5cb
          python -m pip install -e '.[dev]'
          ruff check src/datagoblin/zk_connected_search_gym.py tests/test_zk_connected_search_gym.py
          python -m pytest tests/test_zk_connected_search_gym.py -v
          python -m datagoblin.zk_connected_search_gym --out zkl14b-first.json
          python -m datagoblin.zk_connected_search_gym --test-start 14201 --out zkl14b-fresh.json
      - uses: actions/upload-artifact@v4
        with:
          name: zkl14b-paired-receipts
          path: |
            zkl14b-first.json
            zkl14b-fresh.json
