name: ZKL-12 cross-repository degree-tier gym
on:
  pull_request:
    paths:
      - 'src/datagoblin/zk_poly_gym.py'
      - 'tests/test_zk_poly_gym.py'
      - '.github/workflows/zkl12.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/SatsHedgeZero
          ref: a52debae36578f5f875fe78f1b13234eb351fca0
          path: shz-pinned
      - name: Cross-replay exact certificates and exhaustive controls
        env:
          ZKL12_CHECKER_ROOT: ${{ github.workspace }}/shz-pinned/research/zk_lean
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_zk_poly_gym.py -v
