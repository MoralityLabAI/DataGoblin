name: MeTTa native query SFT candidates

on:
  push:
    branches: [data/metta-annotated-seed-20261122]
    paths:
      - '.github/workflows/metta-native-query-candidates.yml'

permissions:
  contents: write

jobs:
  source-conditioned-packets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/metta-annotated-seed-20261122
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source and native claims, construct SFT candidates
        run: |
          set -euo pipefail
          python -m unittest discover -s MeTTa/training_data/tests -v
          python MeTTa/training_data/scripts/native_query_packets.py
      - name: Lint SFT candidate builder
        run: |
          python -m pip install 'ruff==0.17.6'
          ruff check MeTTa/training_data/scripts/native_query_packets.py MeTTa/training_data/tests/test_native_query_packets.py
      - name: Commit candidate-only packets and manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MeTTa/training_data/training_candidates MeTTa/training_data/reports/hyperon_query_candidates.json
          git commit -m 'data(metta): add native-agreed source-conditioned MeTTa query candidates'
          git push origin HEAD:data/metta-annotated-seed-20261122
