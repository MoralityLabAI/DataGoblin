name: MOLT-04 learned retention
on:
  pull_request:
    paths:
      - 'src/datagoblin/training_gym/molt_retention*.py'
      - 'tests/test_molt_retention.py'
      - '.github/workflows/molt-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learned-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_molt_retention.py
      - run: ruff check src/datagoblin/training_gym/molt_retention*.py tests/test_molt_retention.py
      - run: |
          python -m datagoblin.training_gym.molt_retention_train --train-roots 1024 --dev-roots 128 --steps 256 --seeds 31 37 41 43 --out /tmp/molt-retention-v4.json
      - uses: actions/upload-artifact@v4
        with:
          name: molt-04-development-receipts
          path: /tmp/molt-retention-v4.json
          retention-days: 7
