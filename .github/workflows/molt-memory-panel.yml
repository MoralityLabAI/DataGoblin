name: MOLT-03 memory panels
on:
  pull_request:
    paths:
      - 'src/datagoblin/training_gym/molt_*.py'
      - 'tests/test_molt_memory_panel.py'
      - '.github/workflows/molt-memory-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_molt_memory_panel.py
      - run: ruff check src/datagoblin/training_gym/molt_memory_panel.py tests/test_molt_memory_panel.py
      - run: |
          for mode in full recent2 current bank1 bank2; do
            echo "MODE=$mode"
            python -m datagoblin.training_gym.molt_memory_panel --mode "$mode" --roots 32 --seed 713 --max-actions 512 --wall-seconds 30 --out "/tmp/molt-$mode.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: molt-03-development-controls
          path: /tmp/molt-*.json
          retention-days: 7
