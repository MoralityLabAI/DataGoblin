name: RLT native Lean trained tactic and stopping pilot

on:
  push:
    branches: [research/rlt-native-lean-stop-20261122]
    paths:
      - "src/datagoblin/training_gym/rlt_gym/native_lean_stop.py"
      - "tests/unit/test_rlt_gym_native_lean_stop.py"
      - ".github/workflows/rlt-native-lean-stop.yml"
  pull_request:
    paths:
      - "src/datagoblin/training_gym/rlt_gym/native_lean_stop.py"
      - "tests/unit/test_rlt_gym_native_lean_stop.py"
      - ".github/workflows/rlt-native-lean-stop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-train-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      LEAN_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU package and tests
        run: python -m pip install -e ".[dev]"
      - name: Verify root splits and TRAIN-only learning contracts
        run: python -m pytest -q tests/unit/test_rlt_gym_native_lean_stop.py
      - name: Ruff
        run: |
          ruff check \
            src/datagoblin/training_gym/rlt_gym/native_lean_stop.py \
            tests/unit/test_rlt_gym_native_lean_stop.py
      - name: Install pinned real Lean 4.12.0
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.12.0
          "$HOME/.elan/bin/lean" --version
      - name: Run native Lean kernel checks and independent candidate replay
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          LEAN_PREFIX="$("$HOME/.elan/bin/lean" --print-prefix)"
          LEAN_BIN="$LEAN_PREFIX/bin/lean"
          timeout --signal=TERM --kill-after=15s 1100s \
            python -m datagoblin.training_gym.rlt_gym.native_lean_stop \
            --lean "$LEAN_BIN" --per-split 8 --source-seed 20261126 --alpha-ood \
            --out runs/rlt-native-lean-stop
      - name: Retain source roots, fitted weights, native receipts and kernel proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-rlt-native-lean-alpha-normalized-dev
          path: runs/rlt-native-lean-stop/
          if-no-files-found: warn
          retention-days: 21
