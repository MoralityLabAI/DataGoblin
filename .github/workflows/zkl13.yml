name: ZKL-13 paired search-policy gym
on:
  pull_request:
    paths:
      - 'src/datagoblin/zk_search_gym.py'
      - 'tests/test_zk_search_gym.py'
      - '.github/workflows/zkl13.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/SatsHedgeZero
          ref: c4a80400cc901f9528e735ac882292f973ea24da
          path: shz-pinned
      - name: Confirm checkout and run paired policies
        env:
          PYTHONPATH: ${{ github.workspace }}/shz-pinned/research/zk_lean
          ZKL13_CHECKER_ROOT: ${{ github.workspace }}/shz-pinned/research/zk_lean
        run: |
          test "$(git -C shz-pinned rev-parse HEAD)" = c4a80400cc901f9528e735ac882292f973ea24da
          python -m pip install -e '.[dev]'
          python -m pytest tests/test_zk_search_gym.py -v
          python -m datagoblin.zk_search_gym --out zkl13-first.json
          python -m datagoblin.zk_search_gym --test-start 13201 --out zkl13-fresh.json
      - uses: actions/upload-artifact@v4
        with:
          name: zkl13-paired-receipts
          path: |
            zkl13-first.json
            zkl13-fresh.json
