name: MOLT-05 frozen write intervention
on:
  pull_request:
    paths:
      - 'src/datagoblin/training_gym/molt_retention*.py'
      - 'tests/test_molt_retention_steer*.py'
      - '.github/workflows/molt-retention-steer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-steer:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_molt_retention_steer*.py
      - run: ruff check src/datagoblin/training_gym/molt_retention_steer*.py tests/test_molt_retention_steer*.py
      - run: python -m datagoblin.training_gym.molt_retention_steer_run --out /tmp/molt-steer-v5.json
      - uses: actions/upload-artifact@v4
        with:
          name: molt-05-development-receipts
          path: /tmp/molt-steer-v5.json
          retention-days: 7
