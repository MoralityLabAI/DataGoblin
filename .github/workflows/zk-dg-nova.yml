name: ZK-DG native Nova smoke
on:
  pull_request:
    paths:
      - 'experiments/zk_dg_nova/**'
      - 'src/datagoblin/zk_*.py'
      - 'tests/test_zk_*.py'
      - '.github/workflows/zk-dg-nova.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zk-dg-nova-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Rust toolchain receipt
        run: |
          rustc --version
          cargo --version
      - name: Build pinned direct Nova dependency
        run: cargo build --release --manifest-path experiments/zk_dg_nova/Cargo.toml
      - name: Frontier prove and independent verify smoke
        run: |
          PYTHONPATH=src python experiments/zk_dg_nova/smoke.py \
            --out "$RUNNER_TEMP/zk-dg-frontier" --nodes 3 --depth 2 --frontier \
            --native experiments/zk_dg_nova/target/release/zk-dg-nova --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zk-dg-nova-dev-receipt
          path: |
            experiments/zk_dg_nova/Cargo.lock
            ${{ runner.temp }}/zk-dg-frontier/statement.json
            ${{ runner.temp }}/zk-dg-frontier/statement.sha256
            ${{ runner.temp }}/zk-dg-frontier/proof.bin
          if-no-files-found: warn
