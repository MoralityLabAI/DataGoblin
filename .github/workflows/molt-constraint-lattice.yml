name: DISTILL-22 constraint-lattice reuse
on:
  pull_request:
    paths:
      - 'src/datagoblin/training_gym/molt_constraint_lattice.py'
      - 'tests/test_molt_constraint_lattice.py'
      - '.github/workflows/molt-constraint-lattice.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  constraint-lattice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_molt_constraint_lattice.py tests/test_molt_critical_witness.py tests/test_molt_exclusion_atlas.py tests/test_molt_packed_policy.py tests/test_molt_compact_policy.py tests/test_molt_memory_panel.py
      - run: ruff check src/datagoblin/training_gym/molt_constraint_lattice.py tests/test_molt_constraint_lattice.py
      - run: python -m datagoblin.training_gym.molt_constraint_lattice --native-roots 8 --array-roots 8 --out /tmp/distill22-lattice.json
      - uses: actions/upload-artifact@v4
        with:
          name: distill-22-constraint-lattice
          path: /tmp/distill22-lattice.json
          if-no-files-found: error
          retention-days: 14
