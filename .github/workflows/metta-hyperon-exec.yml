name: MeTTa Hyperon execution pilot

on:
  push:
    branches: [data/metta-annotated-seed-20261122]
    paths:
      - '.github/workflows/metta-hyperon-exec.yml'

jobs:
  sandboxed-process-observation:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/metta-annotated-seed-20261122
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Hyperon interpreter
        run: python -m pip install --disable-pip-version-check 'hyperon==0.2.10'
      - name: Execute selected MeTTa scripts under per-process time limits
        run: python Metta/training_data/scripts/run_hyperon.py --max-files 20 --timeout-sec 12
      - uses: actions/upload-artifact@v4
        with:
          name: metta-hyperon-execution-receipts
          if-no-files-found: error
          path: |
            Metta/training_data/runtime_receipts/hyperon_0_2_10.jsonl
            Metta/training_data/reports/hyperon_0_2_10.json
  commit-run-receipts:
    needs: sandboxed-process-observation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/metta-annotated-seed-20261122
      - uses: actions/download-artifact@v4
        with:
          name: metta-hyperon-execution-receipts
      - name: Commit unverified execution observations
        run: |
          set -euo pipefail
          test -s Metta/training_data/runtime_receipts/hyperon_0_2_10.jsonl
          test -s Metta/training_data/reports/hyperon_0_2_10.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Metta/training_data/runtime_receipts Metta/training_data/reports/hyperon_0_2_10.json
          git commit -m 'data(metta): record pinned Hyperon runtime execution observations'
          git push origin HEAD:data/metta-annotated-seed-20261122
