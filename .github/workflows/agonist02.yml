name: AGN-02 learned research curation pilot

on:
  pull_request:
    paths:
      - "Agonist/**"
      - "tests/unit/test_agonist02.py"
      - ".github/workflows/agonist02.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-student:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONHASHSEED: "0"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline dependency and test tools
        run: python -m pip install -e ".[dev]"
      - name: Lint both agonist modules
        run: ruff check Agonist tests/unit/test_agonist_gym.py tests/unit/test_agonist02.py
      - name: Run causal and matched-student unit tests
        run: python -m pytest tests/unit/test_agonist_gym.py tests/unit/test_agonist02.py
      - name: Produce 50-root pilot and replay independent checks
        run: |
          python -m Agonist.agn02 run --seed 17 --out "$RUNNER_TEMP/agonist02_dev50"
          python -m Agonist.agn02 replay --archive "$RUNNER_TEMP/agonist02_dev50"
