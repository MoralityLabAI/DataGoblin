name: Pinned solved-conjectures Lean intake

on:
  push:
    branches: [master]
    paths:
      - "scripts/stage_solved_conjectures.py"
      - "tests/unit/test_solved_conjectures_intake.py"
      - ".github/workflows/solved-conjectures-intake.yml"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/solved-conjectures-intake.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test read-only staging on a synthetic Git repository
        run: |
          python -m pip install . pytest ruff
          python -m pytest -q tests/unit/test_solved_conjectures_intake.py
          ruff check scripts/stage_solved_conjectures.py tests/unit/test_solved_conjectures_intake.py
      - name: Fetch exact upstream commit without checking out or executing its code
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/solved-conjectures"
          git -C "$RUNNER_TEMP/solved-conjectures" fetch --depth=1 --no-tags \
            https://github.com/1337isnot1337/solved-conjectures.git \
            e1cf80b80c2fe9d22d83f1dc3673410a2ac1bf2e
          python scripts/stage_solved_conjectures.py \
            --source "$RUNNER_TEMP/solved-conjectures" --out runs/solved-conjectures-intake
      - name: Retain metadata only
        uses: actions/upload-artifact@v4
        with:
          name: solved-conjectures-source-inventory
          path: runs/solved-conjectures-intake/
          retention-days: 21
          if-no-files-found: error
