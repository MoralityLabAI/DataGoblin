name: Goose Lean rollout contracts

on:
  pull_request:
    paths:
      - 'apps/lean-goose/**'
      - 'src/datagoblin/training_gym/rlt_gym/lean_goose*.py'
      - 'tests/unit/test_rlt_lean_goose.py'
      - '.github/workflows/lean-goose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build pinned Goose dependencies
        run: |
          cargo fmt --check --manifest-path apps/lean-goose/Cargo.toml
          cargo test --locked --manifest-path apps/lean-goose/Cargo.toml
      - name: Install native Lean 4.12
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain leanprover/lean4:v4.12.0
          echo "DATAGOBLIN_LEAN_412=$HOME/.elan/bin/lean" >> "$GITHUB_ENV"
      - name: Test goal transitions and training custody
        run: |
          python -m pip install -e '.[dev]'
          ruff check src/datagoblin/training_gym/rlt_gym/lean_goose*.py tests/unit/test_rlt_lean_goose.py
          python -m pytest tests/unit/test_rlt_lean_goose.py
