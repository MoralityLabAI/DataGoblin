name: MeTTa-05 native direct-query pilot

on:
  pull_request:
    paths:
      - '.github/workflows/metta-direct-query-pilot.yml'
      - 'MeTTa/training_data/scripts/direct_query_pilot.py'
      - 'MeTTa/training_data/tests/test_direct_query_pilot.py'
      - 'MeTTa/training_data/scripts/public_root_splits.py'
      - 'MeTTa/training_data/training_candidates/**'
      - 'MeTTa/training_data/DIRECT_QUERY_PROTOCOL.md'
  push:
    branches: [master]
    paths:
      - '.github/workflows/metta-direct-query-pilot.yml'
      - 'MeTTa/training_data/scripts/direct_query_pilot.py'
      - 'MeTTa/training_data/tests/test_direct_query_pilot.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-query-observations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Hyperon runtime and lint checker
        run: python -m pip install 'hyperon==0.2.10' 'ruff==0.17.6'
      - name: Check offline query pilot contracts
        run: |
          ruff check MeTTa/training_data/scripts/direct_query_pilot.py MeTTa/training_data/tests/test_direct_query_pilot.py
          python -m unittest discover -s MeTTa/training_data/tests -p 'test_direct_query_pilot.py' -v
      - name: Reconstruct and execute bounded native queries
        run: |
          set -euo pipefail
          mkdir -p runs/metta/direct_query_pilot
          python MeTTa/training_data/scripts/direct_query_pilot.py \
            --max-packets 24 --timeout-sec 8 \
            --out runs/metta/direct_query_pilot/observations.jsonl \
            --report runs/metta/direct_query_pilot/report.json \
            > runs/metta/direct_query_pilot/stdout.json
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("runs/metta/direct_query_pilot")
          report = json.loads((base / "report.json").read_text())
          rows = [json.loads(line) for line in (base / "observations.jsonl").read_text().splitlines()]
          assert report["selected_cases"] == 24
          assert report["selected_source_roots"] >= 19
          assert len(rows) == report["selected_cases"]
          assert sum(report["observed_by_status"].values()) == len(rows)
          assert report["scope"] == "native_replay_diagnostics_only"
          assert report["training_ready"] is False
          assert report["independent_semantic_oracle"] is False
          assert report["sealed_eval_eligible"] is False
          assert all(x["training_ready"] is False for x in rows)
          assert all(x["independent_semantic_oracle"] is False for x in rows)
          print("Direct-query observations:", report["observed_by_status"])
          PY
      - name: Preserve direct-query process receipts
        uses: actions/upload-artifact@v4
        with:
          name: metta05-direct-query-pilot
          path: |
            runs/metta/direct_query_pilot/observations.jsonl
            runs/metta/direct_query_pilot/report.json
            runs/metta/direct_query_pilot/stdout.json
          retention-days: 14
          if-no-files-found: error
