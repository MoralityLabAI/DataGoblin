name: RLT BSAR-09 exact Fraction repair gym

on:
  pull_request:
    paths:
      - "training/rlt_gym/bsar09/**"
      - "tests/unit/test_rlt_gym_bsar09_repair.py"
      - ".github/workflows/rlt-bsar09-repair.yml"
  push:
    branches: [master]
    paths:
      - "training/rlt_gym/bsar09/**"
      - "tests/unit/test_rlt_gym_bsar09_repair.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install DataGoblin local test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test exact repair and public heldout custody
        run: python -m pytest tests/unit/test_rlt_gym_bsar09_repair.py -q
      - name: Enforce style
        run: ruff check training/rlt_gym/bsar09 tests/unit/test_rlt_gym_bsar09_repair.py
      - name: Rebuild deterministic trainer and one-visit baseline
        run: |
          python -m training.rlt_gym.bsar09.gym freeze --out generated/bsar09
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("generated/bsar09/manifest.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          assert report["source_corpus"]["examples"] == 464
          assert report["source_corpus"]["pairs"] == 232
          assert report["constant_positive_baseline"]["cases"] == 144
          assert report["constant_positive_baseline"]["classification_accuracy"] == 0.5
          assert report["constant_positive_baseline"]["fully_completed_pairs"] == 0
          assert report["training_model_evaluated"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bsar09-fraction-repair-curriculum
          path: generated/bsar09/
          retention-days: 14
