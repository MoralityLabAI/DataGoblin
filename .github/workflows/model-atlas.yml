name: model-atlas-metadata
on:
  pull_request:
    paths:
      - "src/datagoblin/gym_metadata.py"
      - "src/datagoblin/model_atlas*.py"
      - "schemas/model_atlas_*.json"
      - "training/model_atlas/**"
      - "tests/unit/test_model_atlas*.py"
      - ".github/workflows/model-atlas.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install jsonschema
      - run: python -m pytest tests/unit/test_model_atlas.py tests/unit/test_model_atlas_corpus.py
      - run: ruff check src/datagoblin/gym_metadata.py src/datagoblin/model_atlas*.py tests/unit/test_model_atlas*.py
      - name: Collect pinned public metadata only
        run: |
          python -m datagoblin.model_atlas --sources training/model_atlas/sources.json \
            --cache runs/model-atlas/cache --out runs/model-atlas/collated --fetch-metadata
          python -c "import json; from pathlib import Path; m=json.loads(Path('runs/model-atlas/collated/inventory.json').read_text()); assert m['model_count']==55 and m['study_count']==5 and m['training_examples_released']==0"
      - name: Collate pinned extracts offline and compare with the committed report
        run: |
          python -m datagoblin.model_atlas_corpus --queue training/model_atlas/repositories.json             --sources training/model_atlas/sources.json --cache runs/model-atlas/cache --out runs/model-atlas/corpus
          python - <<'PY'
          import json
          from pathlib import Path
          new = json.loads(Path("runs/model-atlas/corpus/inventory.json").read_text())
          old = json.loads(Path("training/model_atlas/corpus_report.json").read_text())
          assert new["output_sha256"] == old["output_sha256"], "corpus differs from committed report"
          assert new["training_ready"] is False and new["weights_loaded"] == 0 and new["training_examples_released"] == 0
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model-atlas-corpus
          path: runs/model-atlas/corpus/
          retention-days: 14

      - name: Collate recently indexed gym metadata offline
        run: |
          python -m datagoblin.gym_metadata \
            --sources training/model_atlas/gym_metadata/sources.json \
            --out runs/model-atlas/gym-metadata
      - uses: actions/upload-artifact@v4
        with:
          name: model-atlas-recent-gym-metadata
          path: runs/model-atlas/gym-metadata/
          retention-days: 14
