name: MeTTa-11 CPU trajectory pilot

on:
  pull_request:
    paths:
      - ".github/workflows/metta-trajectory.yml"
      - "MeTTa/ram_*.py"
      - "MeTTa/airis02_stop.py"
      - "MeTTa/airis02_student.py"
      - "MeTTa/sft_oracle.py"
      - "MeTTa/RAM_TRAJECTORY.md"
      - "tests/unit/test_metta_trajectory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-trajectory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "hyperon==0.2.10"
      - run: python -m pytest tests/unit/test_metta_trajectory.py tests/unit/test_metta_ram_hillclimb.py
      - name: Train and independently query the exported MeTTa trajectory facts
        run: |
          python -m MeTTa.ram_hillclimb_trajectory --out runs/metta11-ci --native-replay
      - uses: actions/upload-artifact@v4
        with:
          name: metta11-ci-training-evidence
          path: runs/metta11-ci
          retention-days: 14
