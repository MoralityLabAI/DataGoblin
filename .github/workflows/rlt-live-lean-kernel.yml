name: RLT live Lean 4 kernel postfailure roots

on:
  push:
    branches:
      - research/native-lean-mcp-rlt-20261122
    paths:
      - "src/datagoblin/training_gym/rlt_gym/live_lean_exit_eval.py"
      - "tests/unit/test_rlt_gym_live_native_eval.py"
      - ".github/workflows/rlt-live-lean-kernel.yml"
  pull_request:
    paths:
      - "src/datagoblin/training_gym/rlt_gym/live_lean_exit_eval.py"
      - "tests/unit/test_rlt_gym_live_native_eval.py"
      - ".github/workflows/rlt-live-lean-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      LEAN_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DataGoblin CPU and testing dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check safe generated native source world format
        run: >-
          python -m pytest -q tests/unit/test_rlt_gym_live_native_eval.py
      - name: Install exact Lean 4.22.0 toolchain via elan
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.22.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Run real Lean proofs and separately recheck kernel axioms
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          LEAN_PREFIX="$("$HOME/.elan/bin/lean" --print-prefix)"
          LEAN_BIN="$LEAN_PREFIX/bin/lean"
          "$LEAN_BIN" --version
          timeout --signal=TERM --kill-after=15s 750s \
            python -m datagoblin.training_gym.rlt_gym.live_lean_exit_eval \
            --lean-bin "$LEAN_BIN" --roots-per-split 3 \
            --out runs/live-lean-kernel
      - name: Retain source hashes, exact kernel receipts, and candidate replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dg-rlt-lean4-native-kernel-roots
          path: runs/live-lean-kernel/
          if-no-files-found: warn
          retention-days: 21
