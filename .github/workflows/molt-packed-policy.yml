name: DISTILL-19 packed MoLT scale study
on:
  pull_request:
    paths:
      - 'src/datagoblin/training_gym/molt_packed_policy.py'
      - 'src/datagoblin/training_gym/molt_compact_policy.py'
      - 'tests/test_molt_packed_policy.py'
      - '.github/workflows/molt-packed-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packed-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_molt_packed_policy.py tests/test_molt_compact_policy.py tests/test_molt_memory_panel.py
      - run: ruff check src/datagoblin/training_gym/molt_packed_policy.py tests/test_molt_packed_policy.py
      - run: python -m datagoblin.training_gym.molt_packed_policy --native-roots 24 --array-roots 16 --out /tmp/distill19-packed-molt.json
      - uses: actions/upload-artifact@v4
        with:
          name: distill-19-packed-molt
          path: /tmp/distill19-packed-molt.json
          if-no-files-found: error
          retention-days: 14
