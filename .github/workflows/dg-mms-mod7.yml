name: DG MOD7 MMS CPU
on:
  pull_request:
    paths:
      - 'research/dg_gym/mod7_mms.py'
      - 'src/datagoblin/training_gym/mms.py'
      - 'tests/test_dg_mms_mod7.py'
      - '.github/workflows/dg-mms-mod7.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: 'src:.'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]' && pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_dg_mms_mod7.py
      - run: python -m research.dg_gym.mod7_mms --gym bijective --updates 8 --mms-mib 1 --out /tmp/dg-mms
