name: MeTTa PLN-inspired lineage shadow

on:
  pull_request:
    paths:
      - 'MeTTa/pln_lineage.py'
      - 'MeTTa/PLN_LINEAGE_SHADOW.md'
      - 'tests/unit/test_metta_pln_lineage.py'
      - '.github/workflows/metta-pln-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lineage-stamps-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: python -m pip install -e ".[dev]"
      - name: Lint and regression
        run: |
          ruff check MeTTa/pln_lineage.py tests/unit/test_metta_pln_lineage.py
          python -m pytest -q tests/unit/test_metta_pln_lineage.py
      - name: Generate zero-authority evidence fixture
        run: |
          python -m MeTTa.pln_lineage --out runs/metta/pln_lineage_shadow.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("runs/metta/pln_lineage_shadow.json").read_text())
          assert p["training_ready"] is False
          assert p["authorization"] == "none"
          assert p["native_pln_executed"] is False
          assert p["confidence_calibrated"] is False
          assert p["declared_lineages"] == 2
          assert p["claim_ids_unique"] == 3
          assert p["replayed_identical_evidence_ids"] == 1
          print("lineage independence shadow gate: PASS")
          PY
      - name: Archive advisory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metta-pln-shadow-receipt
          path: runs/metta/pln_lineage_shadow.json
          if-no-files-found: warn
          retention-days: 14
