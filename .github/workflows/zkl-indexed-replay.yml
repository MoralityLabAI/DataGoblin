name: ZKL indexed proof replay
on:
  pull_request:
    paths:
      - 'training/zklean_certificate_pilot/indexed/**'
      - '.github/workflows/zkl-indexed-replay.yml'
  push:
    paths:
      - 'training/zklean_certificate_pilot/indexed/**'
      - '.github/workflows/zkl-indexed-replay.yml'
permissions:
  contents: read
jobs:
  indexed-python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest numpy
      - run: python -m pytest -q training/zklean_certificate_pilot/indexed/test_weighted.py training/zklean_certificate_pilot/indexed/test_dag.py training/zklean_certificate_pilot/indexed/test_astar.py training/zklean_certificate_pilot/indexed/test_affine_bridge.py training/zklean_certificate_pilot/indexed/test_tie.py training/zklean_certificate_pilot/indexed/test_export_nova_batch.py
  lean-kernel-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned Lean 4 release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zkl-lean"
          curl --fail --location --retry 2 --max-time 180 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o "$RUNNER_TEMP/zkl-lean/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/zkl-lean/lean.tar.zst" -C "$RUNNER_TEMP/zkl-lean"
          echo "$RUNNER_TEMP/zkl-lean/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"
      - name: Install pinned numerical dependency
        run: python -m pip install 'numpy==2.2.6'
      - name: Export and replay public pilot proofs
        run: |
          set -euo pipefail
          lean --version
          mkdir -p "$RUNNER_TEMP/zkl-exercises"
          for seed in 10000 10001 10002 10003 10004 10005 20000 20001; do
            limit=12
            if [ "$seed" -ge 20000 ]; then limit=24; fi
            python training/zklean_certificate_pilot/indexed/lean_export.py --seed "$seed" --limit "$limit" > "$RUNNER_TEMP/zkl-exercises/Proof$seed.lean"
            timeout 30s lean "$RUNNER_TEMP/zkl-exercises/Proof$seed.lean"
          done
      - name: Replay the exact paired ZKL-16 shared DAGs
        run: |
          set -euo pipefail
          python training/zklean_certificate_pilot/indexed/lean_batch_export.py --out "$RUNNER_TEMP/zkl-paired"
          for proof in "$RUNNER_TEMP/zkl-paired/"*.lean; do
            timeout 30s lean "$proof"
          done
