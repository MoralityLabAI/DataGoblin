name: RV23-C native closure proofs
on:
  push:
    branches:
      - research/verifiers-v2.2-adaptive-research-20261128
    paths:
      - ".github/workflows/research-closure-proof.yml"
      - "src/datagoblin/research_v2_2/closure_proof.py"
      - "tests/unit/test_research_v2_2_closure_proof.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-closure-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/Compactification-Theory
          ref: 7fa19c90372b13d71676e6fef13819d2a18b9be3
          path: _distill
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e . "numpy==2.2.6" pytest
      - run: python -m pytest tests/unit/test_research_v2_2_closure_proof.py
      - run: python -m datagoblin.research_v2_2.closure_proof --distill-checkout _distill --out "$RUNNER_TEMP/rv23c.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rv23c-aggregate
          path: ${{ runner.temp }}/rv23c.json
          if-no-files-found: warn
