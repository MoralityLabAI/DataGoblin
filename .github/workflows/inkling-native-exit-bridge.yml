name: DataGoblin native RLT exit evidence bridge

on:
  push:
    branches:
      - research/inkling-varloop-distill-20261121
    paths:
      - "src/datagoblin/training_gym/rlt_gym/native_exit_bridge.py"
      - "tests/unit/test_rlt_gym_native_exit_bridge.py"
      - ".github/workflows/inkling-native-exit-bridge.yml"
  pull_request:
    paths:
      - "src/datagoblin/training_gym/rlt_gym/native_exit_bridge.py"
      - "tests/unit/test_rlt_gym_native_exit_bridge.py"
      - ".github/workflows/inkling-native-exit-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install DataGoblin core and development tools
        run: python -m pip install -e ".[dev]"
      - name: Verify native model receipt custody and exact Sudoku controls
        run: python -m pytest -q tests/unit/test_rlt_gym_native_exit_bridge.py
      - name: Lint new source and tests
        run: >-
          ruff check src/datagoblin/training_gym/rlt_gym/native_exit_bridge.py
          tests/unit/test_rlt_gym_native_exit_bridge.py
