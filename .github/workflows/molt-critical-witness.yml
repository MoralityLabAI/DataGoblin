name: DISTILL-21 critical optimum witness
on:
  pull_request:
    paths:
      - 'src/datagoblin/training_gym/molt_critical_witness.py'
      - 'src/datagoblin/training_gym/molt_exclusion_atlas.py'
      - 'tests/test_molt_critical_witness.py'
      - '.github/workflows/molt-critical-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_molt_critical_witness.py tests/test_molt_exclusion_atlas.py tests/test_molt_packed_policy.py tests/test_molt_compact_policy.py tests/test_molt_memory_panel.py
      - run: ruff check src/datagoblin/training_gym/molt_critical_witness.py src/datagoblin/training_gym/molt_exclusion_atlas.py tests/test_molt_critical_witness.py
      - run: python -m datagoblin.training_gym.molt_critical_witness --native-roots 8 --array-roots 8 --out /tmp/distill21-witness.json
      - uses: actions/upload-artifact@v4
        with:
          name: distill-21-critical-witness
          path: /tmp/distill21-witness.json
          if-no-files-found: error
          retention-days: 14
