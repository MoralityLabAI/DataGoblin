name: Storyworld native three-mode gym

on:
  push:
    branches:
      - research/storyworld-native-three-mode-gym-20261123
  pull_request:
    paths:
      - "src/datagoblin/training_gym/rlt_gym/storyworld_native.py"
      - "tests/unit/test_rlt_gym_storyworld_native.py"
      - "training/rlt_gym/storyworld_native/**"
      - ".github/workflows/rlt-storyworld-native.yml"

jobs:
  native-storyworld:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout DataGoblin
        uses: actions/checkout@v4
      - name: Checkout pinned GPTStoryworld files
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/GPTStoryworld
          ref: 5cd0b480e9a01d07418cdf8cb3bedbc9d38ef906
          path: GPTStoryworld
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            codex-skills/storyworld-building/scripts/sweepweave_validator.py
            codex-skills/storyworld-building/scripts/json_to_swmd.py
            codex-skills/small-storyworld-builder/scripts/swmd_encounter_index.py
            codex-skills/small-storyworld-builder/scripts/swmd_build_qlora_examples.py
            verifiers_envs/storyworld-hypergames-env/src/spiral_ln/hypergames_single_player.py
            verifiers_envs/storyworld-hypergames-env/src/spiral_ln/evaluation_hypergames.py
            storyworlds/diplomacy/forecast_backstab.json
            storyworlds/charter_of_ashen_aegis.json
            storyworlds/the_fifth_testimony_p2.json
            storyworlds/tsun01b_last_train_home/tsun01b.sweepweave.json
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install DataGoblin and lint dependencies
        run: python -m pip install -e '.[dev]'
      - name: Native tests and source-pinned replay
        env:
          PYTHONPATH: src
          GPTSTORYWORLD_SOURCE: GPTStoryworld
          GPTSTORYWORLD_EXPECT_SHA: 5cd0b480e9a01d07418cdf8cb3bedbc9d38ef906
        run: |
          ruff check src/datagoblin/training_gym/rlt_gym/storyworld_native.py src/datagoblin/training_gym/rlt_gym/storyworld_micro.py src/datagoblin/training_gym/rlt_gym/storyworld_local.py src/datagoblin/training_gym/rlt_gym/storyworld_cohort.py tests/unit/test_rlt_gym_storyworld_native.py tests/unit/test_rlt_gym_storyworld_micro.py tests/unit/test_rlt_gym_storyworld_local.py tests/unit/test_rlt_gym_storyworld_cohort.py
          python -m unittest discover -s tests/unit -p 'test_rlt_gym_storyworld*.py' -v
          python -m datagoblin.training_gym.rlt_gym.storyworld_native --source GPTStoryworld --expect-source-commit "$GPTSTORYWORLD_EXPECT_SHA" --per-mode 2 --seed 23 --out "$RUNNER_TEMP/dg-sw-native"
          python -m datagoblin.training_gym.rlt_gym.storyworld_native --source GPTStoryworld --expect-source-commit "$GPTSTORYWORLD_EXPECT_SHA" --replay "$RUNNER_TEMP/dg-sw-native"
          python -m datagoblin.training_gym.rlt_gym.storyworld_micro --source GPTStoryworld --expect-source-commit "$GPTSTORYWORLD_EXPECT_SHA" --examples-per-encounter 4 --seed 23 --out "$RUNNER_TEMP/dg-sw-micro"
          python -m datagoblin.training_gym.rlt_gym.storyworld_micro --source GPTStoryworld --expect-source-commit "$GPTSTORYWORLD_EXPECT_SHA" --replay "$RUNNER_TEMP/dg-sw-micro"
          python -m datagoblin.training_gym.rlt_gym.storyworld_cohort --source GPTStoryworld --per-mode 2 --micro-examples 2 --micro-max-encounters 4 --seed 23 --out "$RUNNER_TEMP/dg-sw-cohort"
          python -m datagoblin.training_gym.rlt_gym.storyworld_cohort --source GPTStoryworld --replay "$RUNNER_TEMP/dg-sw-cohort"
