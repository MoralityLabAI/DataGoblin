name: DataGoblin seven-family RLT post-failure campaign

on:
  push:
    branches:
      - research/verifier-postfailure-exit-20261121
    paths:
      - "src/datagoblin/training_gym/rlt_gym/postfailure_exit.py"
      - ".github/workflows/rlt-postfailure-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-cpu-campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local DataGoblin controls
        run: python -m pip install -e ".[dev]"
      - name: Freeze source-disjoint seven-family world suite
        run: >-
          python -m datagoblin rlt-gym make-suite
          --seed 20261121 --per-family 3
          --out runs/postfailure/suite
      - name: Collect complete fixed-depth development trajectories
        run: >-
          python -m datagoblin rlt-gym run
          --suite runs/postfailure/suite
          --seeds 7 --training-modes direct --modes direct
          --depths 4 --training-depth 4
          --splits train calibration ordinary_test ood_test
          --terminal-only --omit-controls
          --max-wall-seconds 240
          --out runs/postfailure/full
      - name: Independently re-execute and check all complete trajectories
        run: >-
          python -m datagoblin rlt-gym replay
          --suite runs/postfailure/suite
          --run runs/postfailure/full
          --out runs/postfailure/rollout_replay.json
      - name: Fit TRAIN, select CAL, evaluate ordinary and OOD once
        run: >-
          python -m datagoblin.training_gym.rlt_gym.postfailure_exit
          --suite runs/postfailure/suite
          --run runs/postfailure/full
          --seed 7 --mode direct --training-mode direct --depth 4
          --max-missed-calibration-rescues 0
          --out runs/postfailure/policy
      - name: Print paired verifier cost and solve counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("runs/postfailure/policy/report.json")
          x=json.loads(root.read_text())
          print("provenance",x["provenance"])
          for split,panel in x["evaluations"].items():
              print(split,panel["policies"])
          PY
      - name: Retain private-development receipts without any sealed cohort
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datagoblin-seven-family-postfailure-dev
          path: runs/postfailure/
          if-no-files-found: warn
          retention-days: 14
