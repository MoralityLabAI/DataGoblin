name: Metamath repair unit controls
on:
  pull_request:
    paths:
      - 'training/metamath_gym/**'
      - '.github/workflows/metamath-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s training/metamath_gym -p 'test_*.py' -v
