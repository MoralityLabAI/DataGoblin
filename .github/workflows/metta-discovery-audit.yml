name: MeTTa public discovery inventory audit

on:
  push:
    branches: [data/metta-annotated-seed-20261122]
    paths:
      - '.github/workflows/metta-discovery-audit.yml'
      - 'MeTTa/training_data/scripts/audit_discovery.py'
      - 'MeTTa/training_data/tests/test_discovery.py'

permissions:
  contents: write

jobs:
  audit-discovery-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/metta-annotated-seed-20261122
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate all source index entries and deduplicate Git blob IDs
        run: |
          set -euo pipefail
          python -m unittest discover -s MeTTa/training_data/tests -v
          python MeTTa/training_data/scripts/audit_discovery.py
      - name: Lint discovery audit
        run: |
          python -m pip install 'ruff==0.17.6'
          ruff check MeTTa/training_data/scripts/audit_discovery.py MeTTa/training_data/tests/test_discovery.py
      - name: Commit audit report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MeTTa/training_data/reports/public_discovery.json
          git commit -m 'data(metta): audit full public MeTTa discovery bytes and Git blob deduplication'
          git push origin HEAD:data/metta-annotated-seed-20261122
