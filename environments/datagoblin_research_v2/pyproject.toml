[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datagoblin-research-v2"
version = "0.2.0"
description = "Bounded research experiments for Baby Goblin and checkpoint comparisons"
requires-python = ">=3.11,<3.15"
dependencies = ["data-goblin", "verifiers==0.4.1"]

[tool.hatch.build.targets.wheel]
packages = ["datagoblin_research_v2"]
